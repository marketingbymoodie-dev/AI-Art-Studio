# Petposterous custom-distribution app. Not released.
# scope-drift: ignore
# Create the app in the Dev Dashboard, paste its client_id here, set
# PETPOSTEROUS_SHOPIFY_API_KEY / PETPOSTEROUS_SHOPIFY_API_SECRET on the
# production service, then install with
# /shopify/install?shop={store}.myshopify.com&app=petposterous
# Do not shopify app deploy this file until that app exists.

client_id = "REPLACE_WITH_PETPOSTEROUS_CLIENT_ID"
name = "AI Art Studio Petposterous"
application_url = "https://appai-pod-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "/shopify/webhooks/customers-data-request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "/shopify/webhooks/customers-redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "/shopify/webhooks/shop-redact"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/shopify/webhooks/uninstall"

[[webhooks.subscriptions]]
topics = [ "orders/paid" ]
uri = "/shopify/webhooks/orders-paid"

[[webhooks.subscriptions]]
topics = [ "orders/cancelled" ]
uri = "/shopify/webhooks/orders-cancelled"

[[webhooks.subscriptions]]
topics = [ "refunds/create" ]
uri = "/shopify/webhooks/refunds-create"

[access_scopes]
scopes = "read_products,read_themes,write_products,write_themes,write_content,read_content,write_publications,read_online_store_navigation,write_online_store_navigation,read_customers,write_customers,read_orders,write_resource_feedbacks,write_shipping,read_locations,write_inventory,write_validations,write_orders,read_metaobjects,write_metaobjects"

[app_proxy]
prefix = "apps"
subpath = "appai"
url = "https://appai-pod-production.up.railway.app/api/proxy"

[auth]
redirect_urls = [
  "https://appai-pod-production.up.railway.app/auth/callback",
  "https://appai-pod-production.up.railway.app/shopify/callback",
  "https://appai-pod-production.up.railway.app/api/auth/callback"
]
