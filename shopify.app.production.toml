# Live Partner app — merchant stores. Deploy only after explicit go-live.
# Deploy with: npm run shopify:deploy:production
# Day-to-day default should be staging (npm run shopify:config:use:staging).

client_id = "6f6c83692d275fd284accad7d5a6fefd"
name = "AI Art Studio"
application_url = "https://appai-pod-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "/shopify/webhooks/customers-data-request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "/shopify/webhooks/customers-redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "/shopify/webhooks/shop-redact"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/shopify/webhooks/uninstall"

# Protected Customer Data (PCD) gated webhooks — staging has these live.
# After Partners Dashboard PCD approval, uncomment and redeploy the production app.
#
# Creator Marketplace also needs these on the platform shop:
#   orders/paid      → creator_orders ledger + pack credit grants
#   refunds/create   → creator refunds + pack clawback
#   orders/cancelled → creator cancel + pack clawback
# (Handlers already live in server/routes.ts; see docs/creator-marketplace.md Phase 10.)
#
# [[webhooks.subscriptions]]
# topics = [ "orders/paid" ]
# uri = "/shopify/webhooks/orders-paid"
#
# Also powers: credit ledger debit after Function discount, design product sale
# recording (My Orders), Reward Ladder purchase_threshold grants.
#
# [[webhooks.subscriptions]]
# topics = [ "refunds/create" ]
# uri = "/shopify/webhooks/refunds-create"
#
# [[webhooks.subscriptions]]
# topics = [ "orders/cancelled" ]
# uri = "/shopify/webhooks/orders-cancelled"
#
# carts/create + carts/update feed My Orders ATC counts (also PCD-gated):
#
# [[webhooks.subscriptions]]
# topics = [ "carts/create" ]
# uri = "/shopify/webhooks/carts-create"
#
# [[webhooks.subscriptions]]
# topics = [ "carts/update" ]
# uri = "/shopify/webhooks/carts-update"

[access_scopes]
# write_content required for creating/updating Shopify Pages via Admin API
scopes = "read_products,read_themes,write_products,write_themes,write_content,read_content,write_publications,read_online_store_navigation,write_online_store_navigation,read_customers,write_customers,read_orders,write_resource_feedbacks"

[app_proxy]
# Storefront → backend proxy. No CORS, no hardcoded app URLs in theme extension.
# Storefront calls /apps/appai/* → our backend /api/proxy/*
# Shopify adds shop, timestamp, signature query params automatically.
prefix = "apps"
subpath = "appai"
url = "https://appai-pod-production.up.railway.app/api/proxy"

[auth]
redirect_urls = [
  "https://appai-pod-production.up.railway.app/auth/callback",
  "https://appai-pod-production.up.railway.app/shopify/callback",
  "https://appai-pod-production.up.railway.app/api/auth/callback"
]
